<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GoBron Admin OG Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
    }
    .container {
      text-align: center;
      padding: 60px;
    }
    .logo {
      font-size: 120px;
      font-weight: 900;
      margin-bottom: 30px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    p {
      font-size: 36px;
      font-weight: 400;
      opacity: 0.95;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 24px;
      margin-top: 30px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚽</div>
    <h1>GoBron Admin</h1>
    <p>Futbol maydonlarini boshqarish uchun zamonaviy admin panel</p>
    <div class="badge">🚀 Real-time • 📊 Analytics • 📱 PWA</div>
  </div>
</body>
</html>
